server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Wichtig für große Audio-Dateien (global)
    client_max_body_size 500M;

    # Statische Dateien
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy über Chunker Middleware zum Whisper Backend
    # Der Chunker splittet lange Audiodateien automatisch in Chunks,
    # transkribiert sie einzeln und führt die Ergebnisse zusammen.
    location = /api {
        proxy_pass http://chunker:8000/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für lange Transkriptionen (erhöht auf 2 Stunden für chunked)
        proxy_connect_timeout 120s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;

        # Buffering für große Responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /api/ {
        proxy_pass http://chunker:8000/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für lange Transkriptionen (erhöht auf 2 Stunden für chunked)
        proxy_connect_timeout 120s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;

        # Buffering für große Responses
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Ollama API Proxy für LLM Zusammenfassungen
    location /ollama/ {
        proxy_pass http://ollama:11434/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für LLM-Generierung (5 Minuten)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Streaming-Unterstützung für Echtzeit-Ausgabe
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}